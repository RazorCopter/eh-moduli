{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Accesso al modulo protetto - Etichub Document Collector">
    <title>Accesso Modulo — Etichub</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --brand-50: #fdf2f1;
            --brand-100: #fce4e2;
            --brand-500: #E8847D;
            --brand-600: #d4635b;
            --brand-700: #b24840;
            --gray-50: #f9fafb;
            --gray-100: #f2f4f7;
            --gray-200: #eaecf0;
            --gray-300: #d0d5dd;
            --gray-400: #98a2b3;
            --gray-500: #667085;
            --gray-600: #475467;
            --gray-700: #344054;
            --gray-800: #1d2939;
            --gray-900: #101828;
            --error-50: #fef3f2;
            --error-500: #f04438;
            --error-700: #b42318;
            --shadow-glow: 0 0 0 4px rgba(232, 132, 125, 0.12);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--gray-900);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: #f0ebe5;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(232, 132, 125, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(178, 72, 64, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(232, 181, 193, 0.06) 0%, transparent 40%);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            box-shadow:
                0 20px 24px -4px rgba(16, 24, 40, 0.08),
                0 8px 8px -4px rgba(16, 24, 40, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.8);
            max-width: 420px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }

        .login-logo {
            margin-bottom: 2rem;
        }

        .login-logo img {
            height: 64px;
            width: auto;
            filter: drop-shadow(0 2px 8px rgba(127, 23, 24, 0.1));
        }

        .login-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1.25rem;
            background: var(--brand-50);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--brand-500);
            font-size: 1.5rem;
        }

        .login-title {
            font-size: 1.375rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.375rem;
            letter-spacing: -0.02em;
        }

        .login-subtitle {
            color: var(--gray-500);
            font-size: 0.875rem;
            margin-bottom: 1.75rem;
            line-height: 1.5;
        }

        .error-banner {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            padding: 0.75rem 1rem;
            background: var(--error-50);
            border: 1px solid #fda29b;
            border-radius: 10px;
            color: var(--error-700);
            font-size: 0.8125rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            text-align: left;
            animation: shakeX 0.4s ease-in-out;
        }

        .error-banner i {
            font-size: 1rem;
            flex-shrink: 0;
        }

        .field-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .field-label {
            display: block;
            font-weight: 600;
            font-size: 0.8125rem;
            color: var(--gray-700);
            margin-bottom: 0.375rem;
        }

        .field-input {
            width: 100%;
            padding: 0.6875rem 0.875rem;
            border: 1.5px solid var(--gray-300);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9375rem;
            color: var(--gray-900);
            background: white;
            transition: all 0.2s ease;
            outline: none;
        }

        .field-input::placeholder {
            color: var(--gray-400);
        }

        .field-input:hover {
            border-color: var(--gray-400);
        }

        .field-input:focus {
            border-color: var(--brand-500);
            box-shadow: var(--shadow-glow);
        }

        .btn-access {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
            color: white;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9375rem;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-access::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15));
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .btn-access:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(178, 72, 64, 0.3);
        }

        .btn-access:hover::before {
            opacity: 1;
        }

        .btn-access:active {
            transform: translateY(0);
        }

        .btn-access i {
            font-size: 1rem;
        }

        .powered-by {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--gray-400);
        }

        .powered-by a {
            color: var(--brand-600);
            text-decoration: none;
            font-weight: 500;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shakeX {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <img src="{% static 'images/Etichub_Logo_V2_Verticale_Color.svg' %}"
                 alt="Etichub"
                 loading="eager">
        </div>

        <div class="login-icon">
            <i class="bi bi-lock-fill"></i>
        </div>

        <h1 class="login-title">Accesso al Modulo</h1>
        <p class="login-subtitle">Inserisci la password ricevuta per accedere al modulo di raccolta documenti.</p>

        {% if error %}
        <div class="error-banner">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="field-group">
                <label class="field-label" for="password">Password</label>
                <input
                    type="password"
                    class="field-input"
                    id="password"
                    name="password"
                    placeholder="Inserisci la password del modulo"
                    required
                    autofocus
                    autocomplete="off"
                >
            </div>

            <button type="submit" class="btn-access">
                <i class="bi bi-unlock-fill"></i>
                Accedi al Modulo
            </button>
        </form>

        <div class="powered-by">
            Powered by <a href="#">Etichub</a>
        </div>
    </div>
</body>
</html>
