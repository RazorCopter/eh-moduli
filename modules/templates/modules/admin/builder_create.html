{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .create-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            padding: 3rem;
        }
        .create-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .create-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 1rem;
        }
        .create-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #212529;
            margin: 0;
        }
        .create-subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin: 0.5rem 0 0 0;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            font-weight: 600;
            color: #212529;
            margin-bottom: 0.5rem;
            display: block;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        .btn-submit {
            flex: 1;
            padding: 0.75rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-submit:hover {
            background: #5568d3;
        }
        .btn-cancel {
            flex: 1;
            padding: 0.75rem;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-cancel:hover {
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="create-container">
        <div class="create-header">
            <div class="create-icon">
                <i class="bi bi-file-earmark-plus"></i>
            </div>
            <h1 class="create-title">New Form</h1>
            <p class="create-subtitle">Create a new guided document collection form</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Form Name *</label>
                <input type="text" id="name" name="name" placeholder="e.g., Customer Onboarding Kit" required autofocus>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Brief description of what this form collects..."></textarea>
            </div>

            <div class="form-group">
                <label for="intro_text">Introduction Text</label>
                <textarea id="intro_text" name="intro_text" placeholder="Welcome message shown at the start of the form..."></textarea>
            </div>

            <div class="form-group">
                <label for="privacy_text">Privacy Notice</label>
                <textarea id="privacy_text" name="privacy_text" placeholder="Privacy and data protection notice..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    <i class="bi bi-plus-circle"></i> Create Form
                </button>
                <a href="{% url 'builder_list' %}" class="btn-cancel" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-x-circle"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</body>
</html>
