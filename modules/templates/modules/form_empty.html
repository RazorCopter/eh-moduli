{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#BA3D30">
    <title>Nessun Passaggio Configurato — Etichub</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #FDF8F6 0%, #F9ECE8 50%, #F5E0DB 100%);
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .status-container {
            width: 100%;
            max-width: 580px;
        }

        .status-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 56px 40px;
            box-shadow: 0 20px 60px rgba(186, 61, 48, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(186, 61, 48, 0.12);
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 96px;
            height: 96px;
            background: rgba(186, 61, 48, 0.08);
            border: 2px solid rgba(186, 61, 48, 0.2);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
        }

        .icon-wrapper i {
            font-size: 44px;
            color: #BA3D30;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .message {
            font-size: 15px;
            color: #64748b;
            line-height: 1.65;
            margin-bottom: 32px;
        }

        .btn-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 28px;
            background: #BA3D30;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            border-radius: 12px;
            text-decoration: none;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-brand:hover {
            background: #96261B;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-brand:focus-visible {
            outline: 2px solid #BA3D30;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="status-container">
        <div class="status-card">
            <div class="icon-wrapper">
                <i class="bi bi-folder2-open"></i>
            </div>
            <h1 class="title">Modulo in Configurazione</h1>
            <p class="message">
                Questo modulo non contiene attualmente passaggi di compilazione attivi.
                Puoi procedere al riepilogo finale oppure contattare l'assistenza.
            </p>
            <div>
                <a href="{% url 'form_summary_view' assignment.id %}" class="btn-brand">
                    Vai al Riepilogo <i class="bi bi-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
